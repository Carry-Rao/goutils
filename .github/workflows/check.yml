name: Go Code Quality Check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Check syntax errors
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Check function length & ignored errors
        run: |
          find . -name "*.go" -type f -not -path "./vendor/*" | while read file; do
            echo "Checking: $file"

            awk '
            BEGIN { infunc=0; start=0; fn="" }
            /^\/\// { next }
            /^func / {
              infunc=1; start=NR; fn=$0; next
            }
            infunc && /^{/ { body=NR; next }
            infunc && /^}/ {
              len = NR - body + 1
              if (len >= 1 && len <= 3) {
                print "[ERROR] Function too short (1-3 lines):", fn > "/dev/stderr"
                print "        File: " file " Line:", start " Length:", len > "/dev/stderr"
                exit 1
              }
              if (len >= 50) {
                print "[ERROR] Function too long (50+ lines):", fn > "/dev/stderr"
                print "        File: " file " Line:", start " Length:", len > "/dev/stderr"
                exit 1
              }
              infunc=0
            }' "$file"

            grep -nE "_ = err|if err != nil" "$file" | grep -vE "fmt\.[A-Z]" | head -10 || true
          done

      - name: Staticcheck
        run: staticcheck ./...